name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Link package to repo & make public
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          OWNER=$(echo "${{ github.repository }}" | cut -d'/' -f1 | tr '[:upper:]' '[:lower:]')
          PACKAGE_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f2 | tr '[:upper:]' '[:lower:]')
          REPO="${{ github.repository }}"
          echo "Linking package ${PACKAGE_NAME} to repo ${REPO}..."
          # Link package to repo so it inherits repo visibility (public)
          gh api -X PUT "/repos/${REPO}/packages/container/${PACKAGE_NAME}" \
            -H "Accept: application/vnd.github+json"
          echo "Package linked to repo"
          # Verify visibility
          VISIBILITY=$(gh api "/users/${OWNER}/packages/container/${PACKAGE_NAME}" --jq '.visibility')
          echo "Package visibility: ${VISIBILITY}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}